<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My SMP</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #1e1e1e, #111111);
    color: #f5f5f5;
    font-family: "Courier New", monospace;
    text-align: center;
    overflow-x: hidden;
  }

  h1 {
    font-size: 3em;
    color: #ffcc00;
    margin-top: 50px;
    animation: glow 2s ease-in-out infinite alternate;
  }

  @keyframes glow {
    0% { text-shadow: 0 0 5px #ffcc00, 0 0 10px #ffcc00; }
    100% { text-shadow: 0 0 20px #ffcc00, 0 0 40px #ffcc00; }
  }

  .info {
    margin: 20px 0;
    font-size: 1.3em;
  }

  .mate {
    color: #0a8f0a;
    font-weight: bold;
    font-size: 1.5em;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .promo {
    background: #0a8f0a;
    color: #fff;
    padding: 25px;
    margin: 30px auto;
    width: 80%;
    border-radius: 15px;
    font-weight: bold;
    font-size: 1.3em;
    position: relative;
    overflow: hidden;
  }

  .promo a {
    color: #ffcc00;
    text-decoration: underline;
  }

  /* Sparkle animation */
  .promo::after {
    content: "✨";
    position: absolute;
    top: -20px;
    left: 50%;
    font-size: 2em;
    animation: sparkle 3s linear infinite;
  }

  @keyframes sparkle {
    0% { transform: translateX(-50%) translateY(0) rotate(0deg); opacity: 1; }
    50% { transform: translateX(-50%) translateY(-50px) rotate(180deg); opacity: 0.5; }
    100% { transform: translateX(-50%) translateY(0) rotate(360deg); opacity: 1; }
  }

  footer {
    margin-top: 50px;
    font-size: 1em;
    color: #888;
  }
</style>
</head>
<body>
  <h1>My SMP</h1>
  <div class="info">Szerver verzió: <b>1.21.8 Bukkit</b></div>
  <div class="info">Offline-mode: <b>ON</b></div>
  <div class="info mate">☕ Mate vibe: Aktív!</div>
  <div class="promo">
    Kóstold meg a legjobb yerbát a <a href="https://matemanus.hu" target="_blank">Matemanus.hu</a>-ról! 🍃
  </div>
  <footer>Status: ✅ Minden működik</footer>
</body>
</html>
